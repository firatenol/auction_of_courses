<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <article class="card">
        <h1 th:text="${course.label}">Название курса</h1>
        <dl>
            <dt>Автор</dt>
            <dd th:text="${course.authorName}">Имя автора</dd>
            
            <dt>Стартовая цена</dt>
            <dd>
                <span th:text="${course.priceAtStart}">0</span> ₽
            </dd>
            
            <dt>Текущая цена</dt>
            <dd>
                <span th:text="${course.currentPrice}">0</span> ₽
            </dd>
            
            <dt>Описание</dt>
            <dd th:text="${course.description}">Описание курса</dd>
        </dl>
    </article>
    <br>
    <a th:href="@{/courses}">Вернуться к списку</a>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
