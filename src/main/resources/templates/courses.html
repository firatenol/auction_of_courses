<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1>Курсы</h1>
    <p>Каталог курсов на аукционе.</p>

    <div class="grid" th:if="${!#lists.isEmpty(coursesInfo)}">
        <article class="card" th:each="course : ${coursesInfo}">
            <h2 th:text="${course.label}">Название курса</h2>
            <p>
                <strong>Автор:</strong>
                <span th:text="${course.authorName}">Имя автора</span>
            </p>
            <p>
                <strong>Стартовая цена:</strong>
                <span th:text="${course.priceAtStart}">0</span> ₽
            </p>
            <p>
                <strong>Текущая цена:</strong>
                <span th:text="${course.currentPrice}">0</span> ₽
            </p>
            <a th:href="@{/courses/{courseId}(courseId=${course.id})}">
                Подробнее
            </a>
        </article>
    </div>

    <p th:if="${#lists.isEmpty(coursesInfo)}">
        Курсы пока не добавлены.
    </p>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
