<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1>Школы</h1>
    <p>Каталог школ, предлагающих курсы на аукционе.</p>

    <div class="grid" th:if="${!#lists.isEmpty(schoolInfo)}">
        <article class="card" th:each="school : ${schoolInfo}">
            <h2 th:text="${school.label}">Название школы</h2>
            <p>
                <strong>Количество курсов:</strong>
                <span th:text="${school.countCourse}">0</span>
            </p>
            <p>
                <strong>Рейтинг:</strong>
                <span th:text="${#numbers.formatDecimal(school.rating, 1, 1)}">0.0</span>
            </p>
            <!-- Описание удалено отсюда -->
            
            <!-- Исправлен путь: теперь ведет на /schools/{schoolId} -->
            <a th:href="@{/schools/{schoolId}(schoolId=${school.id})}">
                Подробнее
            </a>
        </article>
    </div>

    <p th:if="${#lists.isEmpty(schoolInfo)}">
        Школы пока не добавлены.
    </p>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
